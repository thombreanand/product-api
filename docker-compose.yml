services:
  mysql:
    image: mysql:8.4
    container_name: product-api-mysql
    environment:
      MYSQL_DATABASE: productdb
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 60s
  api:
    build: .
    container_name: product-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/productdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-to-a-strong-secret-of-at-least-32-bytes
      JWT_ACCESS_EXPIRATION_SECONDS: 900
      APP_CORS_ORIGIN: http://localhost:3000
      APP_ENFORCE_HTTPS: "false"
    ports:
      - "8080:8080"
volumes:
  mysql_data:
