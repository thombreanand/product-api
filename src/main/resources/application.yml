spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/productdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${SERVER_PORT:8080}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-bytes-long}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
  cors:
    allowed-origin: ${APP_CORS_ORIGIN:http://localhost:3000}
  security:
    enforce-https: ${APP_ENFORCE_HTTPS:false}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
